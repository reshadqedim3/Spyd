<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <title>Spy Oyunu (Çox Spy-li Versiya)</title>
  <style>
    body {i
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #111827;
      border-radius: 12px;
      padding: 20px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 1px solid #1f2937;
    }
    h1 { text-align: center; font-size: 20px; margin-bottom: 12px; }
    label { display: block; margin-top: 10px; margin-bottom: 6px; }
    input, select {
      width: 100%; padding: 8px 10px; border-radius: 8px;
      border: 1px solid #4b5563; background: #020617; color: #e5e7eb;
      font-size: 14px; outline: none;
    }
    button {
      padding: 8px 14px; border-radius: 8px; border: none;
      cursor: pointer; font-size: 14px; margin-top: 10px;
    }
    .btn-main { background: #22c55e; color: #022c22; width: 100%; }
    .btn-secondary { background: #1f2937; color: #e5e7eb; width: 48%; }
    .status { margin-top: 10px; text-align: center; }
    .card-box {
      margin-top: 16px; padding: 18px; border-radius: 10px;
      border: 1px dashed #4b5563; text-align: center;
      font-size: 18px; display: none;
    }
    .spy { color: #f97316; font-weight: 700; }
    .location { color: #22c55e; font-weight: 600; }
  </style>
</head>

<body>
  <div class="card">
    <h1>🕵️ Spy Oyunu</h1>

    <label>Oyunçu sayı:</label>
    <input type="number" id="playerCount" min="3" max="20" value="8" />

    <label>Spy sayı:</label>
    <input type="number" id="spyCount" min="1" max="5" value="2" />

    <label>Məkan:</label>
    <select id="locationSelect">
      <option value="random">Təsadüfi</option>
      <option>Məktəb</option><option>Restoran</option>
      <option>Kinozal</option><option>Hava limanı</option>
      <option>Xəstəxana</option><option>Polis bölməsi</option>
      <option>Bank</option><option>Muzey</option>
    </select>

    <button class="btn-main" id="startBtn">Oyunu Başlat</button>

    <div class="status" id="statusText"></div>

    <div class="card-box" id="cardBox"></div>

    <div style="display:flex; gap:4px; margin-top:10px;">
      <button class="btn-secondary" id="showBtn" disabled>Kartı göstər</button>
      <button class="btn-secondary" id="nextBtn" disabled>Növbəti</button>
    </div>
  </div>

  <script>
    const locations = [
      "Məktəb","Restoran","Kinozal","Hava limanı","Xəstəxana",
      "Polis bölməsi","Bank","Muzey","Kitabxana","Metro"
    ];

    const playerCount = document.getElementById("playerCount");
    const spyCount = document.getElementById("spyCount");
    const locationSelect = document.getElementById("locationSelect");
    const startBtn = document.getElementById("startBtn");
    const statusText = document.getElementById("statusText");
    const cardBox = document.getElementById("cardBox");
    const showBtn = document.getElementById("showBtn");
    const nextBtn = document.getElementById("nextBtn");

    let players = 0;
    let spies = [];
    let current = 1;
    let locationName = "";
    let visible = false;

    function randomLocation() {
      return locations[Math.floor(Math.random() * locations.length)];
    }

    function pickSpies(total, spyNum) {
      const arr = [];
      while (arr.length < spyNum) {
        let x = Math.floor(Math.random() * total) + 1;
        if (!arr.includes(x)) arr.push(x);
      }
      return arr;
    }

    startBtn.onclick = () => {
      players = parseInt(playerCount.value);
      const s = parseInt(spyCount.value);

      if (s >= players) {
        alert("Spy sayı oyunçu sayından çox ola bilməz!");
        return;
      }

      spies = pickSpies(players, s);

      locationName = (locationSelect.value === "random")
        ? randomLocation()
        : locationSelect.value;

      current = 1;
      visible = false;
      cardBox.style.display = "none";
      showBtn.disabled = false;
      nextBtn.disabled = false;

      statusText.textContent = `1-ci oyunçu kartına baxa bilər.`;

      console.log("DEBUG -> Spies:", spies, "Location:", locationName);
    };

    showBtn.onclick = () => {
      if (!visible) {
        visible = true;
        cardBox.style.display = "block";

        if (spies.includes(current)) {
          cardBox.innerHTML = `<span class="spy">Sən CASUSsan! 👀</span>`;
        } else {
          cardBox.innerHTML = `Məkan: <span class="location">${locationName}</span>`;
        }

        showBtn.textContent = "Kartı gizlət";
      } else {
        visible = false;
        cardBox.style.display = "none";
        showBtn.textContent = "Kartı göstər";
      }
    };

    nextBtn.onclick = () => {
      if (visible) {
        alert("Əvvəl kartı gizlət!");
        return;
      }

      if (current < players) {
        current++;
        statusText.textContent = `${current}-ci oyunçuya keçin.`;
      } else {
        statusText.textContent = "Bütün kartlar paylandı — oyun başlasın!";
        nextBtn.disabled = true;
        showBtn.disabled = true;
      }
    };
  </script>
</body>
</html>
