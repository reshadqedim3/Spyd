  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #020617;
      color: #e5e7eb;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 12px;
    }

    .wrapper {
      width: 100%;
      max-width: 520px;
      margin: auto;
    }

    .card {
      background: #020617;
      border-radius: 16px;
      padding: 16px 14px 18px;
      border: 1px solid #1f2937;
      box-shadow: 0 10px 25px rgba(0,0,0,0.55);
    }

    @media (min-width: 480px) {
      .card {
        padding: 20px 20px 22px;
      }
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin: 0 0 6px;
    }

    .subtitle {
      text-align: center;
      font-size: 15px;
      color: #9ca3af;
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .field {
      margin-top: 10px;
      width: 100%;
    }

    .field-half {
      flex: 1;
      min-width: 0;
    }

    label {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
      color: #cbd5f5;
    }

    input, select {
      width: 100%;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid #4b5563;
      background: #020617;
      color: #e5e7eb;
      font-size: 16px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px rgba(56,189,248,0.4);
    }

    button {
      border: none;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      padding: 10px 14px;
    }

    .btn-main {
      width: 100%;
      margin-top: 16px;
      background: linear-gradient(135deg, #22c55e, #4ade80);
      color: #022c22;
    }

    .btn-main:active {
      transform: scale(0.98);
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-secondary {
      flex: 1;
      background: #00A86b;
      color: #eeeeee;
      border: 1px solid #1f2937;
      padding: 13px 13px;
      font-size: 16px;
    }

    .btn-secondary:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.45;
      transform: none !important;
      cursor: default;
    }

    .status {
      margin-top: 8px;
      text-align: center;
      font-size: 16px;
      color: #e5e7eb;
      min-height: 18px;
    }

    .card-box {
      margin-top: 14px;
      padding: 16px;
      border-radius: 14px;
      border: 1px dashed #4b5563;
      text-align: center;
      font-size: 18px;
      display: none;
      background: radial-gradient(circle at top, #1e293b, #020617);
    }

    .spy {
      color: #fb923c;
      font-weight: 700;
    }

    .location {
      color: #4ade80;
      font-weight: 600;
    }

    .hint {
      margin-top: 6px;
      text-align: center;
      font-size: 14px;
      color: #6b7280;
    }
  </style>
</head>

  <script>
    const locations = [
      "Məktəb","Restoran","Kinozal","Hava limanı","Xəstəxana",
      "Polis bölməsi","Bank","Muzey","Kitabxana","Metro","Məktəb","Restoran","Kinozal","Hava limanı","Xəstəxana",
"Polis bölməsi","Bank","Muzey","Kitabxana","Metro",

"Universitet","Kafe","Market","Aptek","Poliklinika",
"Teatr","Stadion","İdman zalı","Sinif otağı","Ofis",

"Mətbəx","Yataq otağı","Qonaq otağı","Bağ","Dəniz kənarı",
"Çimərlik","Avtobus dayanacağı","Dəmir yolu vağzalı","Park","Meydan",

"Bakı","Gəncə","Sumqayıt","Şuşa","Naxçıvan",
"İstanbul","Ankara","London","Paris","Berlin",
"Roma","Madrid","New York","Tokio","Moskva","Dubai",

"Albert Einstein","Isaac Newton","Nikola Tesla","Marie Curie",
"Stephen Hawking","Leonardo da Vinci","Pablo Picasso",
"Wolfgang Amadeus Mozart","Ludwig van Beethoven",

"Cristiano Ronaldo","Lionel Messi","Michael Jordan",
"Usain Bolt","Roger Federer","Elon Musk","Steve Jobs","Bill Gates",

"Əl","Kitab","Telefon","Kompyuter","Stol",
"Stul","Pəncərə","Qapı","Divar","Qələm","Kağız",

"Sevincli","Kədərli","Sakit","Səs-küylü","Parlaq","Qaranlıq",
"Rahat","Çətin","Asan","Maraqlı","Darxıdıcı",

"Şirin","Ağıllı","Sürətli","Yavaş","Güclü","Zəif",
"Uzun","Qısa","Hündür","Alçaq","İsti","Soyuq","Yaş","Quru","Məktəb","Universitet","Kollec","Lisey","Uşaq bağçası",
"Restoran","Kafe","Fast-food","Kababxana","Çayxana",
"Market","Supermarket","Mall","Ticarət mərkəzi","Bazar",
"Xəstəxana","Poliklinika","Aptek","Təcili yardım mərkəzi","Laboratoriya",
"Polis bölməsi","Məhkəmə","Prokurorluq","Hərbi hissə","Sərhəd məntəqəsi",
"Hava limanı","Metro stansiyası","Avtovağzal","Dəmiryolu vağzalı","Limanda terminal",
"Muzey","Teatr","Opera və balet","Kinozal","İncəsənət qalereyası",
"Stadion","İdman kompleksi","Fitness zalı","Üzgüçülük hovuzu","Tennis kortu",
"Park","Bulvar","Meydan","Heyvanat bağı","Botanika bağı",
"Kitabxana","Arxiv","Elmi mərkəz","Konfrans zalı","Seminar otağı",
"Ofis","Bank","Sığorta şirkəti","Audit şirkəti","Startap ofisi",
"Fabrika","Zavod","Anbar","Logistika mərkəzi","Sənaye parkı",
"Elektrik yarımstansiyası","Su təmizləmə stansiyası","İstilik elektrik stansiyası","Külək elektrik stansiyası","Günəş elektrik stansiyası",
"Qonaq otağı","Mətbəx","Yataq otağı","Evin həyəti","Qaraj",
"Dağ","Meşə","Çimərlik","Səhra","Dəniz kənarı",
"Otel","Hostel","Kampinq","Pansionat","Kurort",
"Mosque (Məscid)","Kilsə","Sinagog","Məbəd","Ziyarətgah",
"İnformasiya mərkəzi","Turist terminalı","Sərgi salonu","Konsert zalı","Festival meydançası",
"Atelye","Foto-studio","Radiostansiya","TV kanalı","Redaksiya",
"Texnopark","Kiber-idman arenası","Robotika mərkəzi"
    ];

    const playerCount = document.getElementById("playerCount");
    const spyCount = document.getElementById("spyCount");
    const locationSelect = document.getElementById("locationSelect");
    const startBtn = document.getElementById("startBtn");
    const statusText = document.getElementById("statusText");
    const cardBox = document.getElementById("cardBox");
    const showBtn = document.getElementById("showBtn");
    const nextBtn = document.getElementById("nextBtn");

    let players = 0;
    let spies = [];
    let current = 1;
    let locationName = "";
    let visible = false;

    function randomLocation() {
      return locations[Math.floor(Math.random() * locations.length)];
    }

    function pickSpies(total, spyNum) {
      const arr = [];
      while (arr.length < spyNum) {
        const x = Math.floor(Math.random() * total) + 1;
        if (!arr.includes(x)) arr.push(x);
      }
      return arr;
    }

    startBtn.onclick = () => {
      players = parseInt(playerCount.value);
      const s = parseInt(spyCount.value);

      if (isNaN(players) || players < 3) {
        alert("Ən azı 3 oyunçu olmalıdır.");
        return;
      }

      if (isNaN(s) || s < 1) {
        alert("Ən azı 1 spy olmalıdır.");
        return;
      }

      if (s >= players) {
        alert("Spy sayı oyunçu sayından az olmalıdır.");
        return;
      }

      spies = pickSpies(players, s);

      locationName = (locationSelect.value === "random")
        ? randomLocation()
        : locationSelect.value;

      current = 1;
      visible = false;
      cardBox.style.display = "none";
      showBtn.disabled = false;
      nextBtn.disabled = false;

      statusText.textContent = `1-ci oyunçu kartına baxa bilər.`;
      showBtn.textContent = "Kartı göstər";

      // DEBUG: istəsən bax, istəməsən fikir vermə 🙂
      console.log("Spies:", spies, "Location:", locationName);
    };

    showBtn.onclick = () => {
      if (!players) return;

      if (!visible) {
        visible = true;
        cardBox.style.display = "block";

        if (spies.includes(current)) {
          cardBox.innerHTML = `<span class="spy">Sən CASUSsan! 👀</span>`;
        } else {
          cardBox.innerHTML = `Məkan: <span class="location">${locationName}</span>`;
        }

        showBtn.textContent = "Kartı gizlət";
        statusText.textContent = `${current}-ci oyunçu kartına baxır.`;
      } else {
        visible = false;
        cardBox.style.display = "none";
        showBtn.textContent = "Kartı göstər";
        statusText.textContent = `${current}-ci oyunçu kartı gizlədi.`;
      }
    };

    nextBtn.onclick = () => {
      if (!players) return;

      if (visible) {
        alert("Əvvəl kartı gizlət, sonra növbəti oyunçuya keç.");
        return;
      }

      if (current < players) {
        current++;
        statusText.textContent = `${current}-ci oyunçuya telefonu verin.`;
      } else {
        statusText.textContent = "Bütün kartlar paylandı — müzakirə başlasın! 🎯";
        nextBtn.disabled = true;
        showBtn.disabled = true;
      }
    };
  </script>
