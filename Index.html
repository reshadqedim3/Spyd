<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <title>Spy Oyunu (Sadə Versiya)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #111827;
      border-radius: 12px;
      padding: 20px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 1px solid #1f2937;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 12px;
      text-align: center;
    }

    p {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 16px;
      text-align: center;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #4b5563;
      background: #020617;
      color: #e5e7eb;
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
    }

    input:focus, select:focus {
      border-color: #38bdf8;
    }

    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      margin: 4px 2px;
    }

    .btn-main {
      background: #22c55e;
      color: #022c22;
    }

    .btn-main:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .btn-secondary {
      background: #1f2937;
      color: #e5e7eb;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
      text-align: center;
    }

    .card-box {
      margin-top: 16px;
      padding: 18px;
      border-radius: 10px;
      border: 1px dashed #4b5563;
      text-align: center;
      font-size: 18px;
      min-height: 50px;
      display: none;
    }

    .spy {
      color: #f97316;
      font-weight: 700;
    }

    .location {
      color: #22c55e;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🕵️ Spy Oyunu</h1>
    <p>Oyunçular kartları NÖVBƏ İLƏ baxsın. Heç kəs digərinin kartını görməsin.</p>

    <label>Oyunçu sayı:</label>
    <input type="number" id="playerCount" min="3" max="15" value="6" />

    <label>Məkan seçimi:</label>
    <select id="locationSelect">
      <option value="random">Təsadüfi məkan</option>
      <option value="Məktəb">Məktəb</option>
      <option value="Restoran">Restoran</option>
      <option value="Kinozal">Kinozal</option>
      <option value="Hava limanı">Hava limanı</option>
      <option value="Xəstəxana">Xəstəxana</option>
      <option value="Polis bölməsi">Polis bölməsi</option>
      <option value="Bank">Bank</option>
      <option value="Muzey">Muzey</option>
      <option value="Futbol stadionu">Futbol stadionu</option>
    </select>

    <button class="btn-main" id="startBtn">Oyunu başlat</button>

    <div class="status" id="statusText"></div>

    <div class="card-box" id="cardBox"></div>

    <div style="text-align:center; margin-top:10px;">
      <button class="btn-secondary" id="toggleCardBtn" disabled>Kartı göstər</button>
      <button class="btn-secondary" id="nextPlayerBtn" disabled>Növbəti oyunçu</button>
    </div>
  </div>

  <script>
    // Sadə məkan siyahısı (təsadüfi üçün)
    const locations = [
      "Məktəb",
      "Restoran",
      "Kinozal",
      "Hava limanı",
      "Xəstəxana",
      "Polis bölməsi",
      "Bank",
      "Muzey",
      "Futbol stadionu",
      "Kitabxana",
      "Avtobus",
      "Metro stansiyası"
    ];

    const playerCountInput = document.getElementById('playerCount');
    const locationSelect = document.getElementById('locationSelect');
    const startBtn = document.getElementById('startBtn');
    const statusText = document.getElementById('statusText');
    const cardBox = document.getElementById('cardBox');
    const toggleCardBtn = document.getElementById('toggleCardBtn');
    const nextPlayerBtn = document.getElementById('nextPlayerBtn');

    let currentPlayer = 1;
    let totalPlayers = 0;
    let spyIndex = 0;
    let chosenLocation = "";
    let cardVisible = false;

    function pickRandomLocation() {
      const i = Math.floor(Math.random() * locations.length);
      return locations[i];
    }

    startBtn.addEventListener('click', () => {
      const n = parseInt(playerCountInput.value, 10);
      if (isNaN(n) || n < 3) {
        alert("Ən azı 3 oyunçu olmalıdır.");
        return;
      }

      totalPlayers = n;
      currentPlayer = 1;
      cardVisible = false;
      cardBox.style.display = "none";
      cardBox.textContent = "";

      // Casusun kim olduğunu təsadüfi seç
      spyIndex = Math.floor(Math.random() * totalPlayers) + 1;

      // Məkanı təyin et
      const selected = locationSelect.value;
      if (selected === "random") {
        chosenLocation = pickRandomLocation();
      } else {
        chosenLocation = selected;
      }

      statusText.textContent = `İndi 1-ci oyunçu kartına baxsın.`;
      toggleCardBtn.disabled = false;
      nextPlayerBtn.disabled = false;
      toggleCardBtn.textContent = "Kartı göstər";

      // Məkan hamıya gizlidir, yalnız kartda görünəcək
      console.log("DEBUG (yalnız sən görürsən): Məkan =", chosenLocation, "| Spy =", spyIndex);
    });

    toggleCardBtn.addEventListener('click', () => {
      if (!totalPlayers) return;

      if (!cardVisible) {
        // Kartı göstər
        cardVisible = true;
        cardBox.style.display = "block";

        if (currentPlayer === spyIndex) {
          cardBox.innerHTML = `<span class="spy">Sən CASUSsan! 👀</span>`;
        } else {
          cardBox.innerHTML = `Məkan: <span class="location">${chosenLocation}</span>`;
        }

        toggleCardBtn.textContent = "Kartı gizlət";
        statusText.textContent = `${currentPlayer}-ci oyunçu kartına baxır.`;
      } else {
        // Kartı gizlət
        cardVisible = false;
        cardBox.style.display = "none";
        toggleCardBtn.textContent = "Kartı göstər";
        statusText.textContent = `${currentPlayer}-ci oyunçu kartı gizlədi.`;
      }
    });

    nextPlayerBtn.addEventListener('click', () => {
      if (!totalPlayers) return;

      if (cardVisible) {
        alert("Əvvəl kartı gizlət, sonra növbəti oyunçuya keç.");
        return;
      }

      if (currentPlayer < totalPlayers) {
        currentPlayer++;
        statusText.textContent = `İndi ${currentPlayer}-ci oyunçu kartına baxsın.`;
      } else {
        statusText.textContent = "Bütün kartlar paylandı. İndi müzakirəyə başlaya bilərsiniz!";
        nextPlayerBtn.disabled = true;
        toggleCardBtn.disabled = true;
      }
    });
  </script>
</body>
</html>
